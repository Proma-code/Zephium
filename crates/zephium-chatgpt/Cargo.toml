[package]
name = "zephium-chatgpt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
windows-subscription-trial = []

[dependencies]
base64.workspace = true
getrandom = "=0.3.4"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "form", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
tokio = { workspace = true, features = ["time", "net", "io-util", "sync"] }
url.workspace = true
zeroize = { version = "=1.9.0", features = ["serde"] }
zephium-core.workspace = true
zephium-credentials.workspace = true

[dev-dependencies]
tempfile.workspace = true
