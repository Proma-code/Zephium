[package]
name = "zephium-chatgpt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Synthetic integration tests only; never enabled by desktop production.
test-fixtures = []
windows-subscription-trial = []

[dependencies]
getrandom = "=0.3.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "form", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
tokio = { workspace = true, features = ["time", "sync"] }
zeroize = { version = "=1.9.0", features = ["serde"] }
zephium-core.workspace = true
zephium-credentials.workspace = true

[dev-dependencies]
tempfile.workspace = true
