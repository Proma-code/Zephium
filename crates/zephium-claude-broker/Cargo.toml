[package]
name = "zephium-claude-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Inert, synthetic Windows fixtures only. Never accepted as vendor qualification.
native-fixtures = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
url.workspace = true
zeroize = "=1.9.0"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_IO", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "claude-broker-fixture"
path = "src/bin/fixture.rs"
required-features = ["native-fixtures"]
