name: Windows Codex original runtime qualification

on:
  push:
    branches: [windows/subscription-accounts]
    paths:
      - 'crates/zephium-codex-broker/**'
      - 'crates/zephium-core/**'
      - 'crates/zephium-store/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-codex-broker.yml'
permissions:
  contents: read
concurrency:
  group: windows-codex-broker-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  codex_broker:
    name: Original Codex runtime and managed ownership (no account or turn)
    if: github.repository == 'Proma-code/Zephium'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-codex-credential-free
          cache-on-failure: true
      - name: Pure pinned contract and framing tests
        run: |
          cargo test -p zephium-codex-broker --locked --features native-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p zephium-codex-broker --locked --features native-fixtures --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Canonical Store migration and continuity tests
        run: |
          cargo test -p zephium-store --locked --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build debug-only credential-free qualifier
        run: cargo build -p zephium-codex-broker --locked --features native-fixtures --bin codex-broker-fixture
      - name: Exact owned profile migration and image resolution negatives
        run: |
          $profile = @(cargo test -p zephium-codex-broker --locked --features native-fixtures,trial-integration --lib profile::native::tests:: -- --ignored --test-threads=1)
          $code = $LASTEXITCODE
          $profile | Write-Output
          if ($code -ne 0) { exit $code }
          if (@($profile | Where-Object { $_ -cmatch '^test result: ok\. 9 passed; 0 failed; 0 ignored;' }).Count -ne 1) { throw 'Expected all nine owned profile tests, including the retained-handle differential.' }
          $image = @(cargo test -p zephium-codex-broker --locked --features native-fixtures,trial-integration --lib image::resolution::tests:: -- --ignored --test-threads=1)
          $code = $LASTEXITCODE
          $image | Write-Output
          if ($code -ne 0) { exit $code }
          if (@($image | Where-Object { $_ -cmatch '^test result: ok\. 2 passed; 0 failed; 0 ignored;' }).Count -ne 1) { throw 'Expected both owned image-resolution tests.' }
      - name: Protected removal and existing-only recovery controls (synthetic data only)
        run: |
          $removal = @(cargo test -p zephium-codex-broker --locked --features native-fixtures,trial-integration --lib profile::native::removal:: -- --ignored --test-threads=1)
          $code = $LASTEXITCODE
          $removal | Write-Output
          if ($code -ne 0) { exit $code }
          if (@($removal | Where-Object { $_ -cmatch '^test result: ok\. 15 passed; 0 failed; 0 ignored;' }).Count -ne 1) { throw 'Expected all fifteen protected removal, recovery, and existing-only admission tests.' }
      - name: Original CLI and standalone startup/config/close (no login or model request)
        run: pwsh -NoProfile -File crates/zephium-codex-broker/qualify-windows.ps1
      - name: Managed synthetic owner and original adjacent compatibility (no login or model request)
        run: pwsh -NoProfile -File crates/zephium-codex-broker/qualify-managed-windows.ps1
