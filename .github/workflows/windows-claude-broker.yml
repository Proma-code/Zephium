name: Windows Claude broker qualification

# A credential-free experiment only; never signs in or invokes inference.
on:
  push:
    branches: [windows/subscription-accounts]
    paths:
      - 'crates/zephium-claude-broker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-claude-broker.yml'

permissions:
  contents: read

concurrency:
  group: windows-claude-broker-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  claude_broker:
    name: Windows Claude broker qualification (no account)
    if: github.repository == 'Proma-code/Zephium'
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-claude-broker-qualification
          cache-on-failure: true
      - name: Build native fixture harness (no account)
        id: fixture_build
        run: cargo build -p zephium-claude-broker --locked --features native-fixtures --bin claude-broker-fixture
      - name: Fresh synthetic account-store fixtures (no account)
        run: |
          $listed = & cargo test -p zephium-claude-broker --locked --features native-fixtures --lib windows::account_store::tests -- --ignored --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listed | Write-Output
          $fixtures = @($listed | Where-Object { $_ -match '^windows::account_store::tests::[a-z_]+: test$' })
          if ($fixtures.Count -ne 14) { throw 'Expected exactly 14 reviewed synthetic store fixtures.' }
          cargo test -p zephium-claude-broker --locked --features native-fixtures --lib windows::account_store::tests -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh cooperating-process custody (five fixed synthetic scenarios)
        if: ${{ !cancelled() && steps.fixture_build.outcome == 'success' }}
        run: |
          $output = & ./target/debug/claude-broker-fixture.exe store-custody
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { exit $code }
          foreach ($marker in @('store-process-parent-custody', 'store-process-clean-release', 'store-process-dirty-refusal', 'store-process-timeout-dirty', 'store-process-overflow-dirty')) {
            if (@($output | Where-Object { $_ -ceq "fixture-stage=$marker; native-code=0" }).Count -ne 1) { throw 'A required fixed store custody scenario did not complete exactly once.' }
          }
      - name: Synthetic fixtures then exact original client startup (no login or inference)
        if: ${{ !cancelled() && steps.fixture_build.outcome == 'success' }}
        run: pwsh -NoProfile -File crates/zephium-claude-broker/qualify-windows.ps1
