name: Windows subscription trial

# Branch artifacts only: no PR trigger, tag, release, deployment or signing key.
on:
  push:
    branches: [windows/subscription-accounts]
    paths-ignore:
      - 'crates/zephium-claude-broker/**'
      - '.github/workflows/windows-claude-broker.yml'

permissions:
  contents: read

concurrency:
  group: windows-subscription-trial-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 isolated trial
    permissions:
      contents: read
      actions: read
    if: github.repository == 'Proma-code/Zephium'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve fresh uncached trial output paths
        id: trial_outputs
        run: |
          . ./scripts/windows-trial-staging-checks.ps1
          $paths = Get-TrialOutputPaths
          . ./scripts/windows-trial-upgrade-checks.ps1
          $upgrade = Get-DeliveredTrialUpgradePaths
          Assert-UpgradeDirectPath $upgrade.InputDirectory
          if (Test-Path -LiteralPath $upgrade.InputDirectory) { throw 'Upgrade input directory already exists.' }
          New-Item -ItemType Directory -Path $upgrade.InputDirectory -ErrorAction Stop | Out-Null
          "upgrade_input=$($upgrade.InputDirectory)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "artifact_directory=$($paths.ArtifactDirectory)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "runtime_directory=$($paths.RuntimeDirectory)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Download exact delivered trial for different-build upgrade preservation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '12640672752'
          repository: Proma-code/Zephium
          run-id: '40297504720'
          github-token: ${{ github.token }}
          path: ${{ steps.trial_outputs.outputs.upgrade_input }}
          skip-decompress: true
          digest-mismatch: error
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-subscription-trial
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Isolation contract and build guard tests
        run: |
          ./scripts/test-windows-trial-binary-identity.ps1
          ./scripts/test-windows-trial-staging.ps1
          ./scripts/test-windows-trial-install-checks.ps1
          ./scripts/test-windows-trial-upgrade.ps1
          ./scripts/test-windows-trial-runtime.ps1
          rustc --edition 2021 --test desktop/src/subscription_registry.rs -o "$env:RUNNER_TEMP/subscription-registry-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/subscription-registry-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/windows-trial.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path desktop/windows-trial-config-tests/Cargo.toml
      - name: Frame type checks, lint and unit tests
        run: pnpm --dir frame run check
      - name: Install pinned browser for component behavior tests
        run: pnpm --dir frame exec playwright install chromium
      - name: Real Chromium account and picker component regressions
        run: >-
          pnpm --dir frame run test:component
          src/features/assist/tests/FaultNote.component.test.ts
          src/features/assist/tests/AssistInteraction.component.test.ts
          src/features/settings/tests/AiSubscriptions.component.test.ts
          src/features/settings/tests/LegacyAccountRecovery.component.test.ts
          src/features/settings/tests/ProfilesPage.component.test.ts
          src/features/codex/tests/CodexQuota.component.test.ts
          src/features/settings/tests/LocalGateway.component.test.ts
          src/features/settings/tests/OpenCodeGo.component.test.ts
          src/features/settings/tests/AiPage.component.test.ts
          src/features/work/tests/ModelPicker.component.test.ts
          src/shared/ui/Select/tests/Select.component.test.ts
      - name: Build frame and verify emitted style contract
        run: |
          pnpm --dir frame run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frame run check:styles
      - name: Native account protocol and trial Credential Manager tests
        run: cargo test -p zephium-chatgpt -p zephium-gateway -p zephium-opencode-go -p zephium-provider-accounts -p zephium-credentials --locked --features zephium-credentials/windows-subscription-trial,zephium-chatgpt/windows-subscription-trial
      - name: Synthetic native trial vault roundtrip (no account)
        run: |
          $filter = 'vault::native_tests::windows::native_trial_vault_roundtrip_preserves_other_fresh_profile_and_cleans_up'
          $listed = & cargo test -p zephium-chatgpt --locked --features windows-subscription-trial,zephium-credentials/windows-subscription-trial --lib $filter -- --ignored --exact --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listed | Write-Output
          $fixtures = @($listed | Where-Object { $_ -ceq "${filter}: test" })
          if ($fixtures.Count -ne 1) { throw 'Expected exactly one reviewed synthetic native vault fixture.' }
          cargo test -p zephium-chatgpt --locked --features windows-subscription-trial,zephium-credentials/windows-subscription-trial --lib $filter -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Subscription routing, accounting and profile-erasure journal regressions
        run: |
          cargo test -p zephium-app --features work-runtime,work-execution --locked work_models::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-app --features work-runtime,work-execution --locked work_lead::source_guard::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-app --features work-runtime,work-execution --locked work_lead::call::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-app --features work-runtime,work-execution --locked profile_deletion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-ipc --locked codex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-ipc --locked chatgpt::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-ipc --locked local_gateway::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-ipc --locked opencode_go::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-agentic --features provider-transport --locked opencode_go::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-agentic --features provider-transport --locked local_gateway::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-work-composition --test page_assist_faults --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-work-composition --features durable-runtime --lib --locked page_assist::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p zephium-agent-controller --all-targets --features provider-transport --locked
      - name: Protected native trial identity test (no user profile)
        run: cargo test -p zephium-private-fs --lib --locked subscription_trial_has_a_distinct_closed_native_storage_component
      - name: Compile and lint the Windows trial including test targets
        run: |
          $env:TAURI_CONFIG = Get-Content desktop/tauri.windows-subscription-trial.conf.json -Raw
          # The config packages this file; the release build regenerates notices.
          python scripts/release/third_party_notices.py target/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p zephium-desktop --all-targets --locked --features windows-subscription-trial -- -D warnings
      - name: Native Codex desktop ownership and removal composition (synthetic only)
        run: |
          $env:TAURI_CONFIG = Get-Content desktop/tauri.windows-subscription-trial.conf.json -Raw
          $listed = @(cargo test -p zephium-desktop --locked --features windows-subscription-trial codex:: -- --list)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($listed | Where-Object { $_ -cmatch '^codex::.+: test$' }).Count -eq 0) { throw 'Expected native Codex desktop composition tests.' }
          cargo test -p zephium-desktop --locked --features windows-subscription-trial codex:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regenerate complete native IPC bindings and reject drift
        run: |
          $env:TAURI_CONFIG = Get-Content desktop/tauri.windows-subscription-trial.conf.json -Raw
          cargo test -p zephium-desktop --locked --features windows-subscription-trial subscription_registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p zephium-desktop --locked --features windows-subscription-trial export_typescript_bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- frame/src/shared/ipc/bindings.ts frame/src/shared/ipc/work-constants.ts frame/src/shared/ipc/codex-bindings.ts frame/src/shared/ipc/chatgpt-bindings.ts
      - name: Build unsigned isolated Windows installer
        run: node scripts/windows-trial.mjs --build
      - name: Verify generated installer identity and stage checksums
        run: ./scripts/stage-windows-trial.ps1
      - name: Delivered-to-candidate upgrade and installer preservation (synthetic data, no app launch)
        run: |
          . ./scripts/windows-trial-staging-checks.ps1
          $installer = Join-Path (Get-TrialOutputPaths).ArtifactDirectory 'Zephium-Subscription-Trial-Windows-x64-setup.exe'
          ./scripts/windows-trial-install-smoke.ps1 -UpgradeFromDeliveredTrial -ExpectedSourceRevision $env:GITHUB_SHA -ExpectedInstallerSha256 ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant())
      - name: Fresh raw trial initialization, owned window and orderly close
        id: runtime_smoke
        run: |
          . ./scripts/windows-trial-staging-checks.ps1
          $installer = Join-Path (Get-TrialOutputPaths).ArtifactDirectory 'Zephium-Subscription-Trial-Windows-x64-setup.exe'
          $executable = Join-Path $PWD 'target/release/zephium-subscription-trial.exe'
          ./scripts/windows-trial-runtime-smoke.ps1 -ExpectedSourceRevision $env:GITHUB_SHA -ExpectedInstallerSha256 ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()) -ExpectedExecutableSha256 ((Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant())
      - name: Retain bounded runtime observation (no raw log)
        if: ${{ !cancelled() && (steps.runtime_smoke.outcome == 'success' || steps.runtime_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-Trial-Startup-Observation-${{ github.sha }}
          path: ${{ steps.trial_outputs.outputs.runtime_directory }}/summary.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Zephium-Subscription-Trial-Windows-x64-${{ github.sha }}
          path: ${{ steps.trial_outputs.outputs.artifact_directory }}/
          if-no-files-found: error
          retention-days: 14

  full_work_regressions:
    name: Independent full Windows Work regressions
    if: github.repository == 'Proma-code/Zephium'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-subscription-trial
          cache-on-failure: true
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - name: All application, provider and durable composition tests without retries
        run: |
          $reportDirectory = Join-Path $PWD 'target/windows-trial-regressions'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $suites = @(
            @{ Name = 'app'; Package = 'zephium-app'; Features = 'work-runtime,work-execution' },
            @{ Name = 'agentic'; Package = 'zephium-agentic'; Features = 'provider-transport,probe-harness' },
            @{ Name = 'composition'; Package = 'zephium-work-composition'; Features = 'durable-runtime' }
          )
          $results = @()
          foreach ($suite in $suites) {
            $junit = Join-Path $PWD 'target/nextest/ci/junit.xml'
            if (Test-Path -LiteralPath $junit) { Remove-Item -LiteralPath $junit }
            cargo nextest run --profile ci --no-fail-fast --retries 0 --locked -p $suite.Package --features $suite.Features
            $code = $LASTEXITCODE
            $hasReport = Test-Path -LiteralPath $junit
            if ($hasReport) {
              Copy-Item -LiteralPath $junit -Destination (Join-Path $reportDirectory ($suite.Name + '.xml'))
            }
            $results += [pscustomobject]@{
              suite = $suite.Name
              source_revision = $env:GITHUB_SHA
              exit_code = $code
              junit_written = $hasReport
            }
          }
          $results | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $reportDirectory 'results.json') -Encoding utf8
          if (@($results | Where-Object { $_.exit_code -ne 0 -or -not $_.junit_written }).Count -ne 0) { exit 1 }
      - name: Retain exact-source test results, including failures
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-Work-Regressions-${{ github.sha }}
          path: target/windows-trial-regressions/
          if-no-files-found: warn
          retention-days: 14

  windows_desktop_source:
    name: Independent Windows Desktop compile and lint
    if: github.repository == 'Proma-code/Zephium'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-subscription-trial
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # Trial configuration intentionally has no devUrl. Compile against real
      # bundled frame assets, independently of the delivery job's UI test order.
      - name: Build real frame prerequisites and verify emitted styles
        run: |
          pnpm --dir frame run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frame run check:styles
      - name: Compile and lint the Windows trial including test targets
        run: |
          $env:TAURI_CONFIG = Get-Content desktop/tauri.windows-subscription-trial.conf.json -Raw
          # The config packages this file; the release build regenerates notices.
          python scripts/release/third_party_notices.py target/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p zephium-desktop --all-targets --locked --features windows-subscription-trial -- -D warnings
